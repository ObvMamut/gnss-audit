      0.5 s of each file read on 13 Oct 2026). The record's table gives 1174 s for 4.1.5 (jamming), 896 s for 16.1.1 and
      400 s for 17.1.6, but the file sizes at 2 B per complex sample give 400.0 s for 4.1.5, 896.2 s for 16.1.1 and
      1174.8 s for 17.1.6; the sizes are the stronger evidence. All three files acquire several GPS satellites strongly in
      their first 10 ms. Surveyed antenna position and jammer timing asked by email (R13).

