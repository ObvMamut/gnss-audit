# Admit of segment B (P2b part 2, task 7; docs/7 section 4.2, D-37). Same survey as admit-fgi-jt2023-16.1.1.yaml, with a
# lower C/N0 spread bar and the sky check, which decide whether [0, 119] s of FGI JT23_16.1.1 is admitted as a second
# clean base segment. Is the first 150 s of FGI JT23_16.1.1 (an incoherent-spoofing recording) a clean
# Route B base? Change detectors and absolute checks, plus a survey through the patched receiver on free channels.
id: Admit
dataset: fgi-jt2023
local_path: raw/fgi-jt2023/JT23_16.1.1_L1_E1.iq
item_type: ibyte
fs_hz: 30690000.0
frontend_bw_hz: 20000000.0  # the flat part of the LabSat 3W band (+-10 MHz, docs/7 section 2.3)
template: 1C
decim: 4
fir_taps: 129
workers: 6
max_channels: 12
acquisition: true
band: L1 (GPS L1 C/A, Galileo E1)
receivers: [LabSat 3 Wideband]
coordinates_source: none (the surveyed antenna position is asked of FGI, R13)
timeout_s: 3600
# the survey is no twin: it runs the stock receiver, whose lock rule drops noise tracks and bad starts so the free
# channels keep searching (under D-34's raised limit they are kept for good and hide satellites; P2b task 6)
stock_receiver: true
confirmatory: true
# DEVIATION from the screen's defaults (pre-registered in the plan of 16 Oct 2026, commit 15ef977; D-37; docs/7 section
# 4.2): this recording's C/N0 spread over 30 to 119 s is 5.2 dB, under the 6 dB bar, so the bar is 3.0 dB here, paired
# with the sky check below. The window is trimmed to 119 s (samples 0 to 3 652 110 000 at 30.69 MS/s), the spoofer
# arriving at 130 s and the screen ending a window 1 s before an onset.
rules:
  min_cn0_spread_db: 3.0
  target_len_s: 119.0
# the sky check: GPS time from the survey's observables, position from its fixes, ephemerides of 2023 day 263
# (registry/igs-brdc-2023-261-263.sha256). admission: must pass S1 to S3. negative_control: the spoofer is present from
# 130 s, so this window must fail at least one of them.
sky:
  nav: raw/igs-brdc/extracted/BRDC00IGS_R_20232630000_01D_MN.rnx
  day: "2023-09-20"
  windows:
    - {name: admission, t_start_s: 30.0, t_end_s: 119.0, expect: pass}
    - {name: negative_control, t_start_s: 135.0, t_end_s: 150.0, expect: fail}
