# Admit with the sky-consistency check, positive control (P2b part 2, task 7; docs/7 section 4.2). Same survey as
# admit-fgi-jt2023-4.1.5.yaml, plus the sky check over [30, 120] s, which must pass S1 to S3 (pre-registered, commit
# 15ef977). Is the first 150 s of FGI JT23_4.1.5 (the jamming recording) a clean
# Route B base? Change detectors and absolute checks, plus a survey through the patched receiver on free channels.
id: Admit
dataset: fgi-jt2023
local_path: raw/fgi-jt2023/JT23_4.1.5_L1_E1.iq
item_type: ibyte
fs_hz: 30690000.0
frontend_bw_hz: 20000000.0  # the flat part of the LabSat 3W band (+-10 MHz, docs/7 section 2.3)
template: 1C
decim: 4
fir_taps: 129
workers: 6
max_channels: 12
acquisition: true
band: L1 (GPS L1 C/A, Galileo E1)
receivers: [LabSat 3 Wideband]
coordinates_source: none (the surveyed antenna position is asked of FGI, R13)
timeout_s: 3600
# the survey is no twin: it runs the stock receiver, whose lock rule drops noise tracks and bad starts so the free
# channels keep searching (under D-34's raised limit they are kept for good and hide satellites; P2b task 6)
stock_receiver: true
confirmatory: true
# the sky check (docs/7 section 4.2): GPS time from the survey's observables, position from its fixes, ephemerides of
# 2023 day 261 (registry/igs-brdc-2023-261-263.sha256). Positive control: this window must pass S1, S2 and S3.
sky:
  nav: raw/igs-brdc/extracted/BRDC00IGS_R_20232610000_01D_MN.rnx
  day: "2023-09-18"
  windows:
    - {name: positive_control, t_start_s: 30.0, t_end_s: 120.0, expect: pass}
