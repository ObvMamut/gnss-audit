# The fast gate (Makefile `check`: ruff, pyright and the tests that need no Docker, no data and no long Monte Carlo),
# then every figure redrawn from the committed results, which must match the committed PNGs byte for byte.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # The public repository only: the private development copy spends no Actions minutes (D-48).
    if: github.repository == 'ObvMamut/gnss-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: make check
      - run: make figures
      - run: git diff --stat --exit-code -- figures
