; GPS L1 C/A template for twin runs (docs/9 sections 2 and 3). gnssaudit.sdr.render_config adds the signal source,
; GNSS-SDR.internal_fs_sps, the data type adapter and the channel assignment, then the run's overrides.
; Container paths: the run directory is /data, the input recording's directory is /in (read-only).
[GNSS-SDR]
SignalConditioner.implementation=Signal_Conditioner
InputFilter.implementation=Pass_Through
InputFilter.item_type=gr_complex
Resampler.implementation=Pass_Through
Resampler.item_type=gr_complex
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.pfa=0.01
Acquisition_1C.doppler_max=10000
Acquisition_1C.doppler_step=250
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.dump=true
Tracking_1C.dump_filename=/data/trk_
Tracking_1C.dump_mat=false
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
Observables.implementation=Hybrid_Observables
Observables.dump=true
Observables.dump_filename=/data/observables
Observables.dump_mat=false
GNSS-SDR.observable_interval_ms=20
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.output_rate_ms=100
PVT.display_rate_ms=500
PVT.output_path=/data/pvt
; receiver time must never move once set (docs/9 section 3, item 5): no steering, no one-off correction
PVT.enable_rx_clock_correction=false
PVT.max_clock_offset_ms=1000000000
